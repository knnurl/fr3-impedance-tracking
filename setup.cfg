# flake8 for every Python file in the repo (colcon test runs it through
# ament_flake8 with this file; `flake8` from the repo root reads it too).
[flake8]
max-line-length = 99
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
exclude = .git,build,install,log,__pycache__
